spring.application.name=smo

# Only used when running as an executable jar (main() / spring-boot:run). When the
# WAR is deployed to an external Tomcat, the container owns the port and this is
# ignored - the app is reached via Tomcat's own connector + context path.
server.port=${PORT:8080}

# Database Configuration
# Every value is environment-overridable; the defaults below match the production
# MySQL account. Prefer supplying DB_USERNAME/DB_PASSWORD via environment variables
# (or the container's config) rather than relying on these committed defaults, so
# the credentials aren't sitting in source control.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/smo?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:smo}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Lower this if the target MySQL caps max_user_connections (some shared/free tiers
# allow as few as 5, which HikariCP's default pool of 10 would exhaust on its own).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}

# Fail fast and loudly if the database is unreachable at startup, rather than
# letting the container report a "successful" deploy for an app that can't work.
spring.datasource.hikari.initialization-fail-timeout=10000

# Schema is owned by Flyway migrations (src/main/resources/db/migration). Hibernate is
# restricted to "validate" so it can never auto-alter the schema at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Logging. When deployed as a WAR, Spring Boot's console output goes to the
# container's own log (catalina.out), which is easy to miss - so also write a
# dedicated app log to a known path. Override LOG_PATH per environment.
# Absolute, not relative: a relative path resolves against whatever directory the
# process was launched from, so the file ends up somewhere different depending on
# where you happened to be standing when you ran startup.sh.
logging.file.name=${LOG_PATH:/opt/tomcat/logs/smo-backend.log}
logging.level.root=INFO
logging.level.com.antigravity.mes=${APP_LOG_LEVEL:INFO}
logging.level.org.flywaydb=INFO
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{36} - %msg%n

# Application-layer field encryption (AES-256-GCM) key, used for genuinely sensitive
# columns (employee address, emergency contact number). The default below is a
# DEV-ONLY key generated for this local environment. Production MUST override it via
# an environment variable (or better, a managed KMS) - never reuse a dev key in
# production, and never commit a real production key to source control.
app.encryption.key=${APP_ENCRYPTION_KEY:}

# Session token (JWT, HMAC-SHA256) issued at login and required by activity-gated
# endpoints (see RoleAuthorizationInterceptor). DEV-ONLY secret - override in any
# shared/production environment, same rule as the encryption keys above.
app.jwt.secret=${APP_JWT_SECRET:}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:480}

# HRMS biometric attendance portal (hrms.thegttech.com) integration.
# Enabled by default, but the credentials below are deliberately left blank - supply
# them from OUTSIDE source control (see application.properties.example):
# this repository is public, so a real username/password committed here would be
# exposed to anyone, and would stay in git history even if later removed.
app.hrms.enabled=${HRMS_ENABLED:true}
app.hrms.base-url=${HRMS_BASE_URL:https://hrms.thegttech.com}
app.hrms.username=${HRMS_USERNAME:}
app.hrms.password=${HRMS_PASSWORD:}

# Claude (Anthropic) AI-generated production report. Disabled unless a real API key
# is supplied via environment variable - never commit a real key to source control.
app.anthropic.enabled=${ANTHROPIC_REPORTS_ENABLED:true}
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
