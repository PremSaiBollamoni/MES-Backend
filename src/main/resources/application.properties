spring.application.name=mes

# Server configuration - Railway (and most PaaS hosts) inject PORT at runtime and
# expect the app to bind to it; falls back to 8080 for local dev.
server.port=${PORT:8080}

# Database Configuration
# Credentials default to a LOCAL-DEV-ONLY, least-privilege MySQL user (mes_app_user)
# scoped to the MES schema only - never the root account. Override every value via
# environment variables in any shared/production environment.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3306/MES?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
spring.datasource.username=${DB_USERNAME:mes_app_user}
spring.datasource.password=${DB_PASSWORD:2JCWZYiuKRHRMBddtklPAwh8}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Free-tier hosted MySQL (e.g. Clever Cloud "dev" plan) caps total connections at 5 -
# HikariCP's default pool size of 10 would exhaust that on its own. Keep the pool small
# enough to leave headroom for another client (a CLI/Workbench session, a second instance).
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:3}

# Schema is owned by Flyway migrations (src/main/resources/db/migration). Hibernate is
# restricted to "validate" so it can never auto-alter the schema at runtime.
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect

spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration
spring.flyway.baseline-on-migrate=true

# Application-layer field encryption (AES-256-GCM) key, used for genuinely sensitive
# columns (employee address, emergency contact number). The default below is a
# DEV-ONLY key generated for this local environment. Production MUST override it via
# an environment variable (or better, a managed KMS) - never reuse a dev key in
# production, and never commit a real production key to source control.
app.encryption.key=${APP_ENCRYPTION_KEY:DWD/IGYAmE0/LTaqDLPd8+NOm+QzLz2ILKhEsj6SaYM=}

# Session token (JWT, HMAC-SHA256) issued at login and required by activity-gated
# endpoints (see RoleAuthorizationInterceptor). DEV-ONLY secret - override in any
# shared/production environment, same rule as the encryption keys above.
app.jwt.secret=${APP_JWT_SECRET:a1wfdQv1CEjar6WTjLkXjC3aqKzkSBLf7Jxm+K9tEn8hN4KEUOjuFiPHUr/HZLYm}
app.jwt.expiration-minutes=${APP_JWT_EXPIRATION_MINUTES:480}

# HRMS biometric attendance portal (hrms.thegttech.com) integration. Disabled by
# default - no outbound call is ever made until this is explicitly turned on AND
# real account credentials are supplied via environment variables. Never commit
# real HRMS credentials to source control.
app.hrms.enabled=${HRMS_ENABLED:false}
app.hrms.base-url=${HRMS_BASE_URL:https://hrms.thegttech.com}
app.hrms.username=${HRMS_USERNAME:}
app.hrms.password=${HRMS_PASSWORD:}

# Claude (Anthropic) AI-generated production report. Disabled unless a real API key
# is supplied via environment variable - never commit a real key to source control.
app.anthropic.enabled=${ANTHROPIC_REPORTS_ENABLED:true}
app.anthropic.api-key=${ANTHROPIC_API_KEY:}
