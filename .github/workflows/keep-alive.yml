name: Keep Render backend warm

on:
  schedule:
    # Every 10 minutes - comfortably under Render free tier's ~15 min idle spin-down.
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping health endpoint
        run: curl -sf https://mes-backend-qibi.onrender.com/api/auth/health || true
